name: Update Internal Dependencies

on:
  workflow_dispatch:
    inputs:
      internal_ref:
        description: Git ref for internal modules (branch/tag/commit)
        required: false
        default: main
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-internal-deps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Update internal dependencies
        env:
          INTERNAL_REF: ${{ github.event.inputs.internal_ref || 'main' }}
        run: ./.github/scripts/update-internal-deps.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-internal-deps
          delete-branch: true
          commit-message: "chore(deps): update internal go modules"
          title: "chore(deps): update internal go modules"
          body: |
            Automated update of internal Go module dependencies.

            - Ref: `${{ github.event.inputs.internal_ref || 'main' }}`
            - Generated by workflow `${{ github.workflow }}`
          labels: dependencies, internal
